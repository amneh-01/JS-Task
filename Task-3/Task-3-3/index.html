<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

<select id="family" onchange="changeFamily()">
    <option value="Arial">Arial</option>
    <option value="Fantasy">Fantasy</option>
    <option value="Courier New">Courier New</option>
</select>


    <select id="size" onchange="changeSize()">
        <option value="10px">10px</option>
        <option value="20px">20px</option>
        <option value="30px">30px</option>
    </select>

<input type="checkbox" id="italic"  value="italic" onchange="changeStyle()">
<label > italic</label>
<input type="checkbox" id="bold"  value="bold" onchange="changeStyle()">
<label > bold</label>
<input type="checkbox" id="underline"  value="underline" onchange="changeStyle()">
<label > underline</label>

<p id="text"> this is text just for test :) </p>



    <script src="java.js"></script>
</body>
</html>
